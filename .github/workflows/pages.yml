name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build index.html
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Claw Compiler Documentation</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
              h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
              ul { list-style: none; padding: 0; }
              li { margin: 8px 0; padding: 8px; background: #f6f8fa; border-radius: 6px; }
              .file-size { color: #586069; font-size: 0.85em; float: right; }
            </style>
          </head>
          <body>
            <h1>Claw Compiler Documentation</h1>
            <p>Auto-generated documentation index. View source on <a href="https://github.com/${{ github.repository }}">GitHub</a>.</p>
            <ul>
          EOF
          for f in $(ls docs/*.md docs/*.claw 2>/dev/null | sort); do
            name=$(basename "$f")
            size=$(ls -lh "$f" | awk '{print $5}')
            echo "          <li><a href=\"$name\">$name</a><span class=\"file-size\">$size</span></li>" >> _site/index.html
          done
          cat >> _site/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
